name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
