name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  console:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: apt-get update && apt-get install -y zip wget git

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        run: bash scripts/fetch-deps.sh

      - name: Build
        run: make dist VERSION=${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: NX-Control-${{ steps.ver.outputs.version }}
          path: dist/sd/

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NX-Control-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
